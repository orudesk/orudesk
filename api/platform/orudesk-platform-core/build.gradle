// What every module shares: security, error responses, tenancy, caching setup.
plugins {
    id 'orudesk.published-library'
    id 'java-test-fixtures'   // src/testFixtures: test helpers that other modules' tests can use
}

description = 'Shared by every Orudesk module: security, tenancy, error responses, caching'

dependencies {
    // "api": modules that use platform-core also see these, because platform-core's own classes expose them
    api 'org.springframework.boot:spring-boot-starter-webmvc'
    api 'org.springframework.boot:spring-boot-starter-security'
    api 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    api 'org.springframework.boot:spring-boot-starter-data-jpa'
    api 'org.springframework.boot:spring-boot-starter-cache'
    api 'org.springframework.boot:spring-boot-starter-flyway'
    // Only the annotations (@Operation, @Tag) that describe endpoints in the OpenAPI contract. Same version
    // as springdoc in the app uses; springdoc itself stays in the app.
    api 'io.swagger.core.v3:swagger-annotations-jakarta:2.2.55'
    // The event publication registry (Day 51): an event for an @ApplicationModuleListener is written to the
    // event_publication table in the publisher's transaction, and marked complete when the listener succeeds
    api platform('org.springframework.modulith:spring-modulith-bom:2.1.2')
    api 'org.springframework.modulith:spring-modulith-starter-jdbc'
    // Email through SMTP (Day 52), behind the EmailSender port
    api 'org.springframework.boot:spring-boot-starter-mail'
    // Gauges for the outbox (Day 54). Only the API: the app's actuator decides where metrics go
    implementation 'io.micrometer:micrometer-core'
    // RecordNullabilityModelConverter plugs into springdoc's schema generation. compileOnly: it's used only
    // when an app has springdoc (which brings swagger-core), and the converter's configuration checks that.
    compileOnly 'io.swagger.core.v3:swagger-core-jakarta:2.2.55'

    def springBoot = platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    testFixturesImplementation springBoot
    testFixturesImplementation 'org.springframework.boot:spring-boot-starter-test'
    testFixturesApi 'org.springframework.boot:spring-boot-testcontainers'
    testFixturesApi 'org.testcontainers:testcontainers-junit-jupiter'
    testFixturesApi 'org.testcontainers:testcontainers-postgresql'
}
