# Test-only settings. This value signs tokens in tests; it is not a real secret.
orudesk.security.jwt.secret=test-only-signing-key-0123456789abcdef
# The tenant new users join. In the app it comes from application.yml, which module tests can't see.
orudesk.identity.default-tenant-id=00000000-0000-0000-0000-000000000001
orudesk.security.jwt.refresh-token-ttl=14d
# Encrypts TOTP secrets in tests (Day 67). Not a real key.
orudesk.identity.mfa.key=dGVzdC1vbmx5LW1mYS1rZXktMDEyMzQ1Njc4OWFiY2Q=
