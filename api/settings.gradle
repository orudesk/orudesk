// One build, several modules. Each include is a folder with its own build.gradle.
pluginManagement {
    includeBuild 'build-logic'   // our own Gradle plugins: the shared conventions every module applies
}

dependencyResolutionManagement {
    repositories {
        mavenCentral()
    }
}

rootProject.name = 'orudesk'

include 'platform:orudesk-platform-core'
include 'platform:orudesk-identity'
include 'apps:orudesk-standard'
