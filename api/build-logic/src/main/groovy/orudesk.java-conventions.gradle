// Applied by every Java module: same Java version, same library versions, same test setup.
plugins {
    id 'java-library'
}

group = 'com.orudesk'   // the version comes from gradle.properties

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    mockitoAgent   // just the Mockito jar, to load it as a Java agent when the tests start
}

dependencies {
    // Spring Boot's list of tested library versions, so modules can write dependencies without versions
    def springBoot = platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    implementation springBoot
    testImplementation springBoot

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    mockitoAgent springBoot
    mockitoAgent('org.mockito:mockito-core') { transitive = false }
}

tasks.named('compileJava') {
    options.compilerArgs << '-parameters'   // keep parameter names, for SpEL like key = "#userId.value()"
}

tasks.named('test') {
    useJUnitPlatform()
    // Load Mockito's agent up front. Attaching it later, while the tests run, makes Java 21+ print a warning,
    // and a future Java will refuse it.
    jvmArgs "-javaagent:${configurations.mockitoAgent.asPath}"
}
