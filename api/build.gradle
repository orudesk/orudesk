plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.orudesk'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.0'

	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'    // talk to MariaDB
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'  // talk to Redis
	implementation 'org.springframework.boot:spring-boot-starter-actuator'    // /actuator/health
	runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'                        // the MariaDB driver

	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.named('bootRun') {
	args = ['--spring.profiles.active=local']
}
