// The People registry: every person an organisation deals with. Owns the party_ tables.
plugins {
    id 'orudesk.java-conventions'
}

dependencies {
    implementation project(':platform:orudesk-platform-core')
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation platform('org.springframework.modulith:spring-modulith-bom:2.1.1')
    implementation 'org.springframework.modulith:spring-modulith-api'   // for @NamedInterface

    testImplementation testFixtures(project(':platform:orudesk-platform-core'))
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
}
