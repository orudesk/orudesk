// The runnable "plain ERP" edition: picks the modules, adds the database driver, settings and main class.
plugins {
    id 'orudesk.spring-boot-app'
}

dependencies {
    implementation project(':platform:orudesk-platform-core')
    implementation project(':platform:orudesk-identity')

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.0'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation testFixtures(project(':platform:orudesk-platform-core'))
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-redis'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.1'
}

tasks.named('bootRun') {
    args = ['--spring.profiles.active=local']
}
