// The runnable "plain ERP" edition: picks the modules, adds the database driver, settings and main class.
plugins {
    id 'orudesk.spring-boot-app'
}

dependencies {
    implementation project(':platform:orudesk-platform-core')
    implementation project(':platform:orudesk-identity')
    implementation project(':modules:orudesk-party')

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'   // /actuator/prometheus, in Prometheus's format
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.0'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation testFixtures(project(':platform:orudesk-platform-core'))
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-redis'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.1'
    testImplementation platform('org.springframework.modulith:spring-modulith-bom:2.1.1')
    testImplementation 'org.springframework.modulith:spring-modulith-core'
    testImplementation 'org.springframework.modulith:spring-modulith-docs'
}

springBoot {
    buildInfo()   // writes META-INF/build-info.properties (name, version, time): the API reports its own version
}

tasks.named('bootRun') {
    args = ['--spring.profiles.active=local']
}
