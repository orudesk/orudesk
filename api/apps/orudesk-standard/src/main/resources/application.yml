spring:
  application:
    name: orudesk
  modulith:
    events:
      # A publication stuck in one state this long is marked FAILED, so the retry (Day 54) picks it up: the
      # instance that was running it crashed, or it was published just before a shutdown.
      staleness:
        published: 15m
        processing: 15m
        resubmitted: 15m

  # Java 21+ virtual threads: each request gets a cheap virtual thread instead of one from Tomcat's pool of 200.
  threads:
    virtual:
      enabled: true

  # Load a local .env file if there is one (optional: production has no file).
  # [.properties] tells Spring to read it as KEY=value lines.
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:orudesk}
    username: ${DB_USERNAME:orudesk_app}
    password: ${DB_PASSWORD}
    hikari:
      # How long a request waits for a free connection. The default, 30 s, means a user stares at a spinner for
      # half a minute when the database is down; 5 s fails fast with a 503 the web app explains.
      connection-timeout: 5000   # milliseconds: Hikari binds a plain number, not "5s"

  jpa:
    hibernate:
      ddl-auto: validate                     # Flyway owns the schema, never Hibernate
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Give up quickly when Redis is unreachable, instead of hanging every request for a minute.
      connect-timeout: 2s
      timeout: 2s

# Each log line carries the request's id (RequestIdFilter), so one request's lines can be found together.
# In containers, LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs (compose.yaml) writes JSON lines instead, with the id as a
# field: what log tools (Loki, Elasticsearch, CloudWatch) read without parsing text.
logging:
  pattern:
    correlation: "[%X{request_id:-}] "

server:
  port: ${SERVER_PORT:8080}
  # Behind Caddy (or any proxy on a private network), take the client's address and scheme from X-Forwarded-*.
  # Tomcat trusts those headers only from private and loopback addresses, so a client can't fake its own (Day 66).
  forward-headers-strategy: native

orudesk:
  identity:
    # Until the tenant comes from the logged-in user (step 11), new users join this one: the demo tenant from V4.
    default-tenant-id: ${ORUDESK_DEFAULT_TENANT_ID:00000000-0000-0000-0000-000000000001}
    # How long a password reset link works (Day 53). Short: the link is as good as the password while it lives.
    password-reset:
      ttl: ${ORUDESK_PASSWORD_RESET_TTL:30m}
    # Two-factor sign-in (Day 67): the key that encrypts authenticator app secrets, 32 bytes in base64
    # (openssl rand -base64 32). Empty: two-factor sign-in is not offered. Keep it as safe as the database backups.
    mfa:
      key: ${ORUDESK_MFA_KEY:}
    # Optional: the first ADMIN, created at startup if both are set (see FirstAdminInitializer).
    first-admin:
      email: ${ORUDESK_ADMIN_EMAIL:}
      password: ${ORUDESK_ADMIN_PASSWORD:}
  security:
    jwt:
      # The key that signs access tokens. At least 32 characters, never committed: set it in .env.
      secret: ${ORUDESK_JWT_SECRET}
      access-token-ttl: 15m
      refresh-token-ttl: 14d
    refresh-cookie:
      secure: ${ORUDESK_REFRESH_COOKIE_SECURE:true}   # HTTPS only. The local profile turns it off for http://localhost
    login:
      # After this many failed logins for one email, that email is blocked until `window` after the first failure
      max-failures: ${ORUDESK_LOGIN_MAX_FAILURES:5}
      window: ${ORUDESK_LOGIN_WINDOW:15m}
  events:
    # The outbox (Day 51): completed event publications stay this long ("did the email go out?"), then go
    keep-completed: ${ORUDESK_EVENTS_KEEP_COMPLETED:7d}
    # Failed publications are retried 1, 2, 4, 8... minutes apart (at most an hour), then left for a person (Day 54)
    retry:
      first-backoff: ${ORUDESK_EVENTS_RETRY_FIRST_BACKOFF:1m}
      max-attempts: ${ORUDESK_EVENTS_RETRY_MAX_ATTEMPTS:10}
  metrics:
    # The secret Prometheus sends to read /actuator/prometheus (at least 32 characters). Empty: nobody can.
    token: ${ORUDESK_METRICS_TOKEN:}
  web:
    # Other origins whose pages may call the API (CORS), comma-separated. Empty: only the same origin.
    allowed-origins: ${ORUDESK_WEB_ALLOWED_ORIGINS:}
    # Where the web app is, for links in emails (Day 52): https://erp.example.org, without a trailing slash
    base-url: ${ORUDESK_WEB_BASE_URL:http://localhost:5173}
  mail:
    # Who emails come from. The mail server itself is spring.mail.host / port / username / password
    # (SPRING_MAIL_HOST...): without a host, emails are written to the log instead of sent.
    from: ${ORUDESK_MAIL_FROM:Orudesk <no-reply@orudesk.local>}

# Actuator: what an orchestrator (Docker, Kubernetes) asks to decide if the app is alive and ready.
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus   # nothing else over HTTP: env, beans and heapdump leak secrets.
                                            # prometheus needs the metrics token (MetricsSecurityConfig)
  endpoint:
    health:
      probes:
        enabled: true               # /actuator/health/liveness and /actuator/health/readiness
      show-details: never           # anonymous callers see UP or DOWN, not database hostnames
      group:
        readiness:
          include: readinessState, db   # no database, no traffic. Liveness never checks the DB: a DB outage
                                        # must not make the orchestrator restart every app instance at once.
  metrics:
    tags:
      application: ${spring.application.name}   # on every metric, so one Prometheus can watch several editions
  health:
    redis:
      enabled: false                # Redis down means 503 on login, not "restart me" or "send no traffic" (Day 12)

# The OpenAPI contract at /v3/api-docs. Sorted and indented, so the copy in web/packages/api-client is the
# same file on every machine and a contract change shows up as a readable diff in the pull request.
springdoc:
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true
  default-produces-media-type: application/json   # what every endpoint answers with; otherwise "*/*"
