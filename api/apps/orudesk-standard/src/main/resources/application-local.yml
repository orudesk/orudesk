management:
  endpoint:
    health:
      show-details: always    # show db/redis details; production hides them

spring:
  jpa:
    show-sql: true            # print SQL to the console while learning
  mail:
    host: localhost           # Mailpit from docker/compose.yaml: the emails are at http://localhost:8025
    port: 1025
orudesk:
  security:
    refresh-cookie:
      secure: false           # the web app runs on plain http://localhost:5173 in development
