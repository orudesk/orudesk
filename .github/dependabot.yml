# Dependabot opens a pull request when a dependency has a new version. CI then tells us if it's safe.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /api
    schedule:
      interval: weekly
    groups:
      spring:                        # one pull request for all Spring updates, not twenty
        patterns: ["org.springframework*"]
  - package-ecosystem: npm           # pnpm workspaces too: Dependabot reads pnpm-lock.yaml
    directory: /web
    schedule:
      interval: weekly
    groups:
      dev-tools:                     # ESLint, Prettier, Vitest... in one pull request
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
