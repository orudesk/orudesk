name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The requests you sent (curl is perfect) and the responses you got. Remove any passwords or tokens.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Orudesk version or commit
