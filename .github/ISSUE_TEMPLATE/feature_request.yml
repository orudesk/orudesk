name: Feature request
description: Suggest something Orudesk should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve, and for whom?
      description: A school office, a hospital reception, an NGO's donor team... Describe the situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How do you imagine it working?
