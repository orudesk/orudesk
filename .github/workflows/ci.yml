# Runs the tests on every push to main and on every pull request.
# GitHub's Ubuntu runners have Docker, so Testcontainers works there with no extra setup.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test
      # The API contract the web app's client is generated from, saved by OpenApiContractTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openapi
          path: api/apps/orudesk-standard/build/openapi/
