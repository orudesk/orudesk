# Runs the tests on every push to main and on every pull request.
# GitHub's Ubuntu runners have Docker, so Testcontainers works there with no extra setup.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# The token only reads: nothing here pushes, comments or publishes
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a   # v4.4.3: a third-party action, pinned to a commit
      - run: ./gradlew test
      # The web app's client is generated from a copy of the contract. If the API changed and the copy didn't,
      # the web app would compile against an API that no longer exists: fail, and say how to fix it.
      - name: The web client's copy of the OpenAPI contract is up to date
        run: |
          diff -u ../web/packages/api-client/openapi/orudesk-standard.json \
            apps/orudesk-standard/build/openapi/orudesk-standard.json \
            || { echo "::error::The API contract changed. Run 'pnpm contract:sync' in web/packages/api-client and commit."; exit 1; }
      # The API contract the web app's client is generated from, saved by OpenApiContractTest
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: openapi
          path: api/apps/orudesk-standard/build/openapi/

  # The web app: formatting, lint, type check, unit tests and a production build.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413   # v4.3.0; installs the pnpm version named in web/package.json
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile   # like npm ci: fail if the lockfile doesn't match package.json
      - name: The generated client matches the contract
        run: |
          pnpm --filter @orudesk/api-client generate
          git diff --exit-code -- packages/api-client/src/generated \
            || { echo "::error::Run 'pnpm generate' in web/packages/api-client and commit."; exit 1; }
      - run: pnpm check
      - run: pnpm build
      # The npm packages as an outside app gets them: packed, installed with npm, type-checked, tested, built
      - run: pnpm test:packages

  # The Dockerfile is code too: build the image on every PR (without pushing) so a broken one is caught here,
  # not on release day.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f   # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8   # v6.19.2
        with:
          context: api
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8   # v6.19.2
        with:
          context: web
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # The whole product as a user gets it (the demo: Caddy, the API, PostgreSQL, Redis, built from this commit),
  # driven by a real browser, at desktop and phone sizes. Slower than the rest, so it runs once they pass.
  e2e:
    needs: [test, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start the demo
        run: docker compose --env-file docker/demo.env -f docker/compose.yaml --profile app up -d --build --wait
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413   # v4.3.0; installs the pnpm version named in web/package.json
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm --filter @orudesk/e2e exec playwright install --with-deps chromium
        working-directory: web
      - run: pnpm --filter @orudesk/e2e e2e
        working-directory: web
      - name: The API's log, when something failed
        if: failure()
        run: docker compose -f docker/compose.yaml --profile app logs app
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/e2e/playwright-report/

