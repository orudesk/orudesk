# The CI of an edition (orudesk-ngo, orudesk-school, orudesk-healthcare...), kept here once instead of copied into
# each edition's repository (Day 65). An edition's .github/workflows/ci.yml calls it:
#
#   jobs:
#     ci:
#       uses: orudesk/orudesk/.github/workflows/edition-ci.yml@main
#       with:
#         edition: orudesk-ngo
#
# It checks out the edition and the core side by side (the edition's Gradle and pnpm builds use ../orudesk), then
# runs the API tests, the contract and generated-client checks, the web checks and build, and the image build.
name: Edition CI

on:
  workflow_call:
    inputs:
      edition:
        description: The edition's repository and app name, such as orudesk-ngo
        type: string
        required: true
      core-ref:
        description: The core's branch or tag to build against
        type: string
        default: main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: ${{ inputs.edition }}
      - uses: actions/checkout@v7
        with:
          repository: orudesk/orudesk
          ref: ${{ inputs.core-ref }}
          path: orudesk
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a   # v4.4.3: a third-party action, pinned to a commit
      - run: ./gradlew test
        working-directory: ${{ inputs.edition }}/api
      - name: The web client's copy of the OpenAPI contract is up to date
        env:
          EDITION: ${{ inputs.edition }}
        run: |
          diff -u "$EDITION/web/openapi/$EDITION.json" "$EDITION/api/apps/$EDITION/build/openapi/$EDITION.json" \
            || { echo "::error::The API contract changed. Run 'pnpm contract:sync' in web/ and commit."; exit 1; }

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.edition }}/web
    steps:
      - uses: actions/checkout@v7
        with:
          path: ${{ inputs.edition }}
      - uses: actions/checkout@v7
        with:
          repository: orudesk/orudesk
          ref: ${{ inputs.core-ref }}
          path: orudesk
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413   # v4.3.0
        with:
          package_json_file: ${{ inputs.edition }}/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: ${{ inputs.edition }}/web/.nvmrc
          cache: pnpm
          cache-dependency-path: ${{ inputs.edition }}/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: The generated client matches the contract
        run: |
          pnpm generate
          git diff --exit-code -- src/generated \
            || { echo "::error::Run 'pnpm generate' in web/ and commit."; exit 1; }
      - run: pnpm check
      - run: pnpm build

  # The image is built from both checkouts, the same way a release does, but not pushed
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: ${{ inputs.edition }}
      - uses: actions/checkout@v7
        with:
          repository: orudesk/orudesk
          ref: ${{ inputs.core-ref }}
          path: orudesk
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f   # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8   # v6.19.2
        with:
          context: .
          file: ${{ inputs.edition }}/api/Dockerfile
          push: false
