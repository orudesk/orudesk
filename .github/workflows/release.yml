# Runs when you push a tag like v0.1.0: tests, signs and uploads the core to Maven Central, then creates
# the GitHub release with that version's CHANGELOG section. A second job pushes the standard edition's
# Docker image to ghcr.io/orudesk/orudesk-standard, tagged with the version and "latest".
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # to create the GitHub release
  packages: write   # to push the Docker image to ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a   # v4.4.3: a third-party action, pinned to a commit

      - name: Check the tag matches the version in gradle.properties
        run: |
          version=$(grep '^version=' gradle.properties | cut -d= -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME but gradle.properties says $version"; exit 1
          fi

      - run: ./gradlew test

      - name: Build and sign what will be uploaded
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew publishAllPublicationsToStagingRepository

      - name: Upload to Maven Central (you press "Publish" on central.sonatype.com)
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          (cd build/staging-deploy && zip -qr ../central-bundle.zip . -x '*maven-metadata.xml*')
          token=$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 -w0)
          curl --fail-with-body -X POST \
            -H "Authorization: Bearer $token" \
            -F bundle=@build/central-bundle.zip \
            "https://central.sonatype.com/api/v1/publisher/upload?name=orudesk-$GITHUB_REF_NAME&publishingType=USER_MANAGED"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" 'index($0, "## [" v "]") == 1 {f=1; next} /^## \[/ {f=0} f' \
            ../CHANGELOG.md > build/release-notes.md
          gh release create "$GITHUB_REF_NAME" --title "Orudesk $GITHUB_REF_NAME" --notes-file build/release-notes.md

  image:
    needs: release   # only a release whose tests passed gets an image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"   # v1.0.0 -> 1.0.0, Docker's convention
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f   # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9   # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8   # v6.19.2
        with:
          context: api
          build-args: APP=orudesk-standard
          push: true
          tags: |
            ghcr.io/orudesk/orudesk-standard:${{ steps.v.outputs.version }}
            ghcr.io/orudesk/orudesk-standard:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      # The web app's image, with the same version: a release is the API and its web app together
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8   # v6.19.2
        with:
          context: web
          build-args: APP=standard
          push: true
          tags: |
            ghcr.io/orudesk/orudesk-standard-web:${{ steps.v.outputs.version }}
            ghcr.io/orudesk/orudesk-standard-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
