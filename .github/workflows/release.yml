# Runs when you push a tag like v0.1.0: tests, signs and uploads the core to Maven Central, then creates
# the GitHub release with that version's CHANGELOG section.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # to create the GitHub release

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4

      - name: Check the tag matches the version in gradle.properties
        run: |
          version=$(grep '^version=' gradle.properties | cut -d= -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME but gradle.properties says $version"; exit 1
          fi

      - run: ./gradlew test

      - name: Build and sign what will be uploaded
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew publishAllPublicationsToStagingRepository

      - name: Upload to Maven Central (you press "Publish" on central.sonatype.com)
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          (cd build/staging-deploy && zip -qr ../central-bundle.zip . -x '*maven-metadata.xml*')
          token=$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 -w0)
          curl --fail-with-body -X POST \
            -H "Authorization: Bearer $token" \
            -F bundle=@build/central-bundle.zip \
            "https://central.sonatype.com/api/v1/publisher/upload?name=orudesk-$GITHUB_REF_NAME&publishingType=USER_MANAGED"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" 'index($0, "## [" v "]") == 1 {f=1; next} /^## \[/ {f=0} f' \
            ../CHANGELOG.md > build/release-notes.md
          gh release create "$GITHUB_REF_NAME" --title "Orudesk $GITHUB_REF_NAME" --notes-file build/release-notes.md
