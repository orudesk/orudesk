# The services Orudesk needs locally: PostgreSQL and Redis, each with a volume so data survives restarts.
# From the repo root:  docker compose --env-file api/.env -f docker/compose.yaml up -d
# --env-file reads DB_PASSWORD from your api/.env, so the password lives in one place.
#
# The whole product, the API and the web app too (what a self-hoster runs), on http://localhost:8090:
#   docker compose --env-file api/.env -f docker/compose.yaml --profile app up -d --build --wait
# A demo with sample data and no setup at all:
#   docker compose --env-file docker/demo.env -f docker/compose.yaml --profile app up -d --build --wait
# A service with a profile only starts when you ask for that profile, so day-to-day development
# (API in your IDE, database in Docker) is unchanged.
name: orudesk

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: orudesk
      POSTGRES_USER: orudesk_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in api/.env}
    ports:
      - "5433:5432"    # 5433 on your Mac, so it doesn't clash with another PostgreSQL on 5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "orudesk_app", "-d", "orudesk"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]    # AOF: refresh tokens survive a restart
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    profiles: [app]
    build:
      context: ../api
      args:
        APP: orudesk-standard
    image: ghcr.io/orudesk/orudesk-standard:${ORUDESK_VERSION:-latest}
    environment:
      # Inside Compose's network the services find each other by name, on their own ports.
      DB_HOST: postgres
      DB_PORT: 5432
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ORUDESK_JWT_SECRET: ${ORUDESK_JWT_SECRET:?set ORUDESK_JWT_SECRET in api/.env}
      ORUDESK_ADMIN_EMAIL: ${ORUDESK_ADMIN_EMAIL:-}
      ORUDESK_ADMIN_PASSWORD: ${ORUDESK_ADMIN_PASSWORD:-}
      SPRING_PROFILES_ACTIVE: ${ORUDESK_PROFILES:-}   # "demo" loads sample data (docker/demo.env)
    ports:
      - "8081:8080"   # 8081 on your machine, so a bootRun on 8080 can run at the same time
    depends_on:
      postgres:
        condition: service_healthy   # wait for pg_isready, not just "container started"
      redis:
        condition: service_healthy
    restart: unless-stopped

  # The web app, and the one door in: Caddy serves the app's files and passes /api to the API. Set
  # ORUDESK_SITE to your domain and Caddy gets an HTTPS certificate by itself (then publish 80 and 443).
  web:
    profiles: [app]
    build:
      context: ../web
      args:
        APP: standard
    image: ghcr.io/orudesk/orudesk-standard-web:${ORUDESK_VERSION:-latest}
    environment:
      ORUDESK_SITE: ${ORUDESK_SITE:-:80}
      ORUDESK_API: app:8080
    ports:
      - "8090:80"
    volumes:
      - caddy-data:/data   # the HTTPS certificates, so a restart doesn't ask Let's Encrypt again
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy-data:
  postgres-data:
  redis-data: